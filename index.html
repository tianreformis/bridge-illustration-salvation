<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ilustrasi Jembatan (by : tianreformis)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#0b1020; --panel:#101830ee; --text:#eef2ff; --sub:#9fb0d0; --accent:#f2c94c;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;}
  #app{position:fixed;inset:0;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
       background:linear-gradient(180deg,transparent,var(--panel) 30%);backdrop-filter:blur(6px);}
  #card{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid #2a3660;border-radius:16px;padding:14px 18px;}
  #title{font-weight:700;color:var(--accent);font-size:1.05rem;margin:0 0 4px;}
  #body{font-size:.92rem;line-height:1.45;color:var(--sub);margin:0;}
  #nav{display:flex;align-items:center;justify-content:space-between;max-width:720px;margin:10px auto 0;gap:10px;}
  .btn{background:#1c274d;color:var(--text);border:1px solid #34407a;border-radius:10px;padding:9px 16px;font-size:.9rem;cursor:pointer;}
  .btn:disabled{opacity:.35;cursor:default;}
  .btn.primary{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:700;}
  #dots{display:flex;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#34407a;}
  .dot.on{background:var(--accent);}
  #top{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;text-align:center;pointer-events:none;}
  #top h1{font-size:1rem;margin:0;color:var(--sub);font-weight:500;letter-spacing:.5px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="top"><h1>ILUSTRASI JEMBATAN (by : @tianreformis)</h1></div>
<div id="hud">
  <div id="card">
    <p id="title">-</p>
    <p id="body">-</p>
  </div>
  <div id="nav">
    <button class="btn" id="prev">← Kembali</button>
    <div id="dots"></div>
    <button class="btn primary" id="next">Lanjut →</button>
  </div>
</div>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 20, 55);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('app').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x8899cc, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(10,20,10); scene.add(sun);

function textSprite(text, opts={}){
  const {size=64, color="#ffffff", weight=700, w=512, h=128, font="Segoe UI, sans-serif"} = opts;
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=color; ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=8;
  ctx.fillText(text, w/2, h/2);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const spr = new THREE.Sprite(mat);
  spr.scale.set(w/40, h/40, 1);
  return spr;
}

// Ground platforms
const leftMat = new THREE.MeshStandardMaterial({color:0x35437a});
const rightMat = new THREE.MeshStandardMaterial({color:0xd8b45a, emissive:0x3a2c00, emissiveIntensity:0.3});
const left = new THREE.Mesh(new THREE.BoxGeometry(9,1,7), leftMat);
left.position.set(-7.5,-0.5,0); scene.add(left);
const right = new THREE.Mesh(new THREE.BoxGeometry(9,1,7), rightMat);
right.position.set(7.5,-0.5,0); scene.add(right);

// Chasm pit (hell) — muncul begitu dosa masuk, disembunyikan di kondisi awal
const chasmGroup = new THREE.Group();
const pitMat = new THREE.MeshStandardMaterial({color:0xaa2211, emissive:0x881100, emissiveIntensity:0.6});
const pit = new THREE.Mesh(new THREE.SphereGeometry(2.6,24,16), pitMat);
pit.position.set(0,-8,0); chasmGroup.add(pit);
for(let i=0;i<8;i++){
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.35,1.1,8), new THREE.MeshStandardMaterial({color:0xff6a2b, emissive:0xff3300, emissiveIntensity:0.8}));
  const a = (i/8)*Math.PI*2;
  flame.position.set(Math.cos(a)*1.8, -6.3, Math.sin(a)*1.8);
  chasmGroup.add(flame);
}
const chasmWall = new THREE.Mesh(new THREE.BoxGeometry(3,9,7), new THREE.MeshStandardMaterial({color:0x7a1f1f, transparent:true, opacity:0.35}));
chasmWall.position.set(0,-4,0); chasmGroup.add(chasmWall);

// DOSA column
const dosaCol = new THREE.Mesh(new THREE.BoxGeometry(1.4,6,1.4), new THREE.MeshStandardMaterial({color:0x8892b0, transparent:true, opacity:0.5}));
dosaCol.position.set(0,2,0); chasmGroup.add(dosaCol);
["D","O","S","A"].forEach((l,i)=>{
  const s = textSprite(l, {size:70, color:"#0b1020", w:128,h:128});
  s.scale.set(1.1,1.1,1); s.position.set(0, 4.3-i*0.95, 0.9); chasmGroup.add(s);
});
const dosaLabel = textSprite("Yes. 59:1-2", {size:40, color:"#ffd9d9", w:400,h:90});
dosaLabel.position.set(0,-1.2,2.2); chasmGroup.add(dosaLabel);
chasmGroup.visible=false; scene.add(chasmGroup);

// Manusia (person)
const person = new THREE.Group();
const head = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({color:0xf0d0b0}));
head.position.y=1.5; person.add(head);
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,1.4,10), new THREE.MeshStandardMaterial({color:0x223055}));
body.position.y=0.6; person.add(body);
person.position.set(-8,0.2,0.5); scene.add(person);
const manusiaLabelNetral = textSprite("Manusia", {size:36, color:"#dfe8ff", w:320,h:80});
manusiaLabelNetral.position.set(-8,2.6,0); scene.add(manusiaLabelNetral);
const manusiaLabel = textSprite("Manusia — Berdosa", {size:34, color:"#ffb3b3", w:420,h:80});
manusiaLabel.position.set(-8,2.6,0); manusiaLabel.visible=false; scene.add(manusiaLabel);

// Jembatan relasi — kondisi AWAL sebelum manusia berdosa: manusia & Allah terhubung
const harmonyGroup = new THREE.Group();
const harmonyPlank = new THREE.Mesh(new THREE.BoxGeometry(15.4,0.3,2.4), new THREE.MeshStandardMaterial({color:0xf2dfa0, emissive:0x4a3c10, emissiveIntensity:0.3}));
harmonyPlank.position.set(0,0.05,0); harmonyGroup.add(harmonyPlank);
for(let i=0;i<5;i++){
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.6,0.15), new THREE.MeshStandardMaterial({color:0xf2dfa0}));
  rail.position.set(-6+i*3, 0.5, 1.1); harmonyGroup.add(rail);
  const rail2 = rail.clone(); rail2.position.z=-1.1; harmonyGroup.add(rail2);
}
scene.add(harmonyGroup);
const harmonyLabel = textSprite("Manusia & Allah berelasi erat", {size:32, color:"#d8ffe0", w:520,h:80});
harmonyLabel.position.set(0,2.2,0); scene.add(harmonyLabel);
const harmonyVerse = textSprite("Kejadian 1:27 & 3:8", {size:28, color:"#bfe8c8", w:360,h:70});
harmonyVerse.position.set(0,1.4,0); scene.add(harmonyVerse);

// ALLAH burst
const allahGroup = new THREE.Group();
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9,1), new THREE.MeshStandardMaterial({color:0xfff2c0, emissive:0xffdd66, emissiveIntensity:0.9}));
allahGroup.add(core);
for(let i=0;i<8;i++){
  const ray = new THREE.Mesh(new THREE.ConeGeometry(0.28,0.9,6), new THREE.MeshStandardMaterial({color:0xfff2c0, emissive:0xffdd66, emissiveIntensity:0.7}));
  const a=(i/8)*Math.PI*2;
  ray.position.set(Math.cos(a)*1.5, Math.sin(a)*1.5*0.6+2.2, 0);
  ray.rotation.z = a+Math.PI/2;
  allahGroup.add(ray);
}
allahGroup.position.set(8,2.2,0); scene.add(allahGroup);
const allahLabel = textSprite("ALLAH — Maha Kudus", {size:34, color:"#ffe9a8", w:460,h:80});
allahLabel.position.set(8,4.3,0); scene.add(allahLabel);
const glow = new THREE.PointLight(0xffdd66, 2, 15); glow.position.copy(allahGroup.position); scene.add(glow);

// Failed bridges (broken planks)
const brokenGroup = new THREE.Group();
const brokenLabels=["Berbuat baik","Beragama","Hidup saleh"];
brokenLabels.forEach((t,i)=>{
  const plank = new THREE.Mesh(new THREE.BoxGeometry(2.6,0.18,0.7), new THREE.MeshStandardMaterial({color:0x555f7a}));
  plank.position.set(-2.6+i*0.3, 0.3-i*0.5, -1.6+i*1.6);
  plank.rotation.z = -0.5-i*0.15;
  const lab = textSprite(t, {size:30, color:"#c9d3ee", w:340,h:70});
  lab.position.set(plank.position.x, plank.position.y+0.8, plank.position.z);
  brokenGroup.add(plank, lab);
});
brokenGroup.visible=false; scene.add(brokenGroup);
const yes64 = textSprite("Yes 64:6", {size:30, color:"#c9d3ee", w:260,h:60});
yes64.position.set(-2.2,-0.6,-2.2); yes64.visible=false; scene.add(yes64);

// The Cross Bridge (Jesus, the true bridge)
const bridgeGroup = new THREE.Group();
const plankMat = new THREE.MeshStandardMaterial({color:0xdedede});
const bridgePlank = new THREE.Mesh(new THREE.BoxGeometry(6.4,0.25,2.2), plankMat);
bridgePlank.position.y=0.6; bridgeGroup.add(bridgePlank);
const crossMat = new THREE.MeshStandardMaterial({color:0xf5f5f5});
const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.35,3,0.35), crossMat);
crossV.position.set(0,2.4,0); bridgeGroup.add(crossV);
const crossH = new THREE.Mesh(new THREE.BoxGeometry(1.8,0.35,0.35), crossMat);
crossH.position.set(0,3.2,0); bridgeGroup.add(crossH);
bridgeGroup.visible=false; scene.add(bridgeGroup);
const yoh316 = textSprite("Yohanes 3:16", {size:34, color:"#ffe6a8", w:340,h:70});
yoh316.position.set(-1.8,4.6,0); yoh316.visible=false; scene.add(yoh316);
const pet318 = textSprite("1 Petrus 3:18", {size:34, color:"#ffe6a8", w:340,h:70});
pet318.position.set(1.9,4.6,0); pet318.visible=false; scene.add(pet318);

// Mendengar / Percaya markers
const dengar = textSprite("Mendengar", {size:32, color:"#a8e0ff", w:320,h:70});
dengar.position.set(-1.6,1.6,1.6); dengar.visible=false; scene.add(dengar);
const percaya = textSprite("Percaya", {size:32, color:"#a8e0ff", w:280,h:70});
percaya.position.set(1.6,1.6,1.6); percaya.visible=false; scene.add(percaya);
const yoh524 = textSprite("Yohanes 5:24", {size:30, color:"#dfe8ff", w:320,h:70});
yoh524.position.set(0,5.6,0); yoh524.visible=false; scene.add(yoh524);

// terima / final
const terima = textSprite("Yohanes 1:12 — Percaya = Menerima", {size:28, color:"#c8ffd0", w:600,h:70});
terima.position.set(0,6.3,0); terima.visible=false; scene.add(terima);
const wahyu320 = textSprite("Wahyu 3:20 — Di manakah Anda sekarang?", {size:26, color:"#ffd9a8", w:620,h:70});
wahyu320.position.set(0,7,0); wahyu320.visible=false; scene.add(wahyu320);

// Camera orbit control (manual drag)
let camAngle = 0.35, camElev = 0.28, camDist = 22, target = new THREE.Vector3(0,0.5,0);
function updateCam(){
  camera.position.set(
    target.x + camDist*Math.cos(camElev)*Math.sin(camAngle),
    target.y + camDist*Math.sin(camElev),
    target.z + camDist*Math.cos(camElev)*Math.cos(camAngle)
  );
  camera.lookAt(target);
}
updateCam();
let dragging=false, lastX=0, lastY=0;
const dom = renderer.domElement;
dom.addEventListener('pointerdown', e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
window.addEventListener('pointerup', ()=>dragging=false);
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  camAngle -= (e.clientX-lastX)*0.005;
  camElev = Math.max(0.05, Math.min(0.85, camElev + (e.clientY-lastY)*0.004));
  lastX=e.clientX; lastY=e.clientY; updateCam();
});
dom.addEventListener('wheel', e=>{
  camDist = Math.max(10, Math.min(38, camDist + e.deltaY*0.02)); updateCam();
}, {passive:true});

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.01;
  allahGroup.rotation.y += 0.01;
  pit.scale.setScalar(1+Math.sin(t*2)*0.03);
  renderer.render(scene, camera);
}
animate();

// Steps / narrative
const steps = [
  {title:"Sebelum dosa: relasi yang erat", body:"Mula-mula manusia dan Allah tidak terpisah. Mereka terhubung erat lewat sebuah jembatan relasi — hidup bersekutu tanpa jurang, tanpa DOSA di antaranya (Kejadian 1:27; 3:8).", view:()=>{camAngle=0.35;camElev=0.26;camDist=23;target.set(0,0.8,0);}, on:()=>{}},
  {title:"Manusia dan Allah", body:"Namun manusia jatuh ke dalam dosa. Jembatan relasi itu runtuh, dan terbentanglah jurang yang disebut DOSA antara manusia yang berdosa dan Allah yang Maha Kudus.", view:()=>{camAngle=0.35;camElev=0.28;camDist=22;target.set(0,1,0);}, on:()=>{}, off:()=>{}},
  {title:"Fakta tentang dosa", body:"Roma 3:23 — semua orang telah berbuat dosa. Roma 6:23 — upah dosa ialah maut. Ibrani 9:27 — manusia ditetapkan untuk mati, dan sesudah itu dihakimi. Hukuman itu pasti, dan berujung pada Neraka (Wahyu 21:8).", view:()=>{camAngle=0.1;camElev=0.15;camDist=18;target.set(0,-2,0);}, on:()=>{}},
  {title:"Usaha manusia gagal", body:"Manusia sering mencoba menjembatani jurang itu dengan usahanya sendiri: berbuat baik, beragama, atau hidup saleh. Namun Yesaya 64:6 berkata, segala kesalehan kita seperti kain kotor — semua usaha itu runtuh ke dalam jurang.", view:()=>{camAngle=-0.2;camElev=0.22;camDist=16;target.set(-1,0,0);}, on:()=>{brokenGroup.visible=true; yes64.visible=true;}, off:()=>{brokenGroup.visible=false; yes64.visible=false;}},
  {title:"Jembatan sejati: Salib Kristus", body:"Yohanes 3:16 — Allah mengasihi dunia sehingga mengaruniakan Anak-Nya. 1 Petrus 3:18 — Kristus telah mati untuk dosa kita, untuk membawa kita kepada Allah. Salib-Nya menjadi satu-satunya jembatan yang menghubungkan manusia dengan Allah.", view:()=>{camAngle=0;camElev=0.2;camDist=17;target.set(0,1.5,0);}, on:()=>{bridgeGroup.visible=true; yoh316.visible=true; pet318.visible=true;}, off:()=>{bridgeGroup.visible=false; yoh316.visible=false; pet318.visible=false;}},
  {title:"Syarat: Mendengar dan Percaya", body:"Yohanes 5:24 — barangsiapa mendengar perkataan-Ku dan percaya kepada Dia yang mengutus Aku, ia beroleh hidup kekal, tidak turut dihukum, dan sudah pindah dari dalam maut ke dalam hidup.", view:()=>{camAngle=0;camElev=0.24;camDist=16;target.set(0,2,0);}, on:()=>{dengar.visible=true; percaya.visible=true; yoh524.visible=true;}, off:()=>{dengar.visible=false; percaya.visible=false; yoh524.visible=false;}},
  {title:"Percaya berarti menerima", body:"Yohanes 1:12 — semua orang yang menerima-Nya diberi-Nya kuasa menjadi anak-anak Allah, yaitu mereka yang percaya dalam nama-Nya. Percaya bukan sekadar tahu, melainkan menerima Dia secara pribadi.", view:()=>{camAngle=0.15;camElev=0.3;camDist=15;target.set(0,3,0);}, on:()=>{terima.visible=true;}, off:()=>{terima.visible=false;}},
  {title:"Di manakah Anda sekarang?", body:"Wahyu 3:20 — 'Lihat, Aku berdiri di muka pintu dan mengetok; jikalau ada orang yang mendengar suara-Ku dan membukakan pintu, Aku akan masuk mendapatkannya.' Pertanyaannya bukan tentang orang lain — tetapi tentang Anda: sudahkah Anda menyeberang lewat jembatan itu?", view:()=>{camAngle=0.3;camElev=0.35;camDist=24;target.set(0,2,0);}, on:()=>{wahyu320.visible=true;}, off:()=>{wahyu320.visible=false;}},
];
let idx=0;
const titleEl=document.getElementById('title'), bodyEl=document.getElementById('body');
const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
const dotsEl=document.getElementById('dots');
steps.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';dotsEl.appendChild(d);});
function render(){
  const s=steps[idx];
  titleEl.textContent = `${idx+1}. ${s.title}`;
  bodyEl.textContent = s.body;
  prevBtn.disabled = idx===0;
  nextBtn.textContent = idx===steps.length-1 ? "Selesai ✓" : "Lanjut →";
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on', i===idx));
  s.view && s.view(); updateCam();
  // Lapisan dasar persisten: sebelum dosa (langkah 0) vs sesudah dosa (langkah 1 dst)
  const sinRevealed = idx >= 1;
  harmonyGroup.visible = !sinRevealed;
  harmonyLabel.visible = !sinRevealed;
  harmonyVerse.visible = !sinRevealed;
  manusiaLabelNetral.visible = !sinRevealed;
  manusiaLabel.visible = sinRevealed;
  chasmGroup.visible = sinRevealed;
  s.on && s.on();
}
function goto(n){
  if(steps[idx].off) steps[idx].off();
  idx = Math.max(0, Math.min(steps.length-1, n));
  render();
}
prevBtn.onclick=()=>goto(idx-1);
nextBtn.onclick=()=>{ if(idx===steps.length-1){ goto(0); } else { goto(idx+1); } };
render();
</script>
</body>
</html>
